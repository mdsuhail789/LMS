services:
  # Backend Web Service
  - type: web
    name: learnflow-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGO_URI
        sync: false # Set this securely in the Render dashboard
      - key: JWT_SECRET
        sync: false # Set this securely in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0" # Specify Python version

  # Frontend Static Site
  - type: web
    name: learnflow-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
    routes:
      # Proxy /api requests to the backend
      - type: rewrite
        source: /api/*
        destination: https://learnflow-backend.onrender.com/api/*
      # React Router fallback
      - type: rewrite
        source: /*
        destination: /index.html
